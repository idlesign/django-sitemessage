name: Python package

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        django-version: ["3.2", "4.0", "4.1", "4.2"]
        exclude:
          - python-version: "3.11"
            django-version: "3.2"
          - python-version: "3.12"
            django-version: "3.2"
          - python-version: "3.11"
            django-version: "4.0"
          - python-version: "3.12"
            django-version: "4.0"
          - python-version: "3.12"
            django-version: "4.1"

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }} & Django ${{ matrix.django-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install deps
      run: |
        python -m pip install -e . coverage coveralls pytest "pytest-djangoapp>=1.6" "Django~=${{ matrix.django-version }}.0"
    - name: Run tests
      env:
        GITHUB_TOKEN: ${{ secrets.github_token }}
      run: |
        coverage run --source=sitemessage -m pytest
        coveralls --service=github
